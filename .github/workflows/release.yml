name: Release
# Builds a playable archive for each platform when a version tag (v*) is pushed.
on:
  push:
    tags: ["v*"]
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos
          - os: windows-2022
            name: windows
          - os: ubuntu-24.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Shaders.cmake') }}
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libvulkan-dev
      - name: macOS deps
        if: runner.os == 'macOS'
        run: brew install ninja
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build
        run: |
          cmake --preset release
          cmake --build --preset release
      - name: Test (all, including the campaign and stress runs)
        run: ctest --preset release -j 4
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: tools/package/package_macos.sh
      - name: Package (Windows, Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          VERSION=$(sed -n 's/^project(urbs VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          OUT=dist/urbs-$VERSION-${{ matrix.name }}
          mkdir -p "$OUT/assets"
          if [ -f build/release/urbs.exe ]; then cp build/release/urbs.exe build/release/urbs_headless.exe "$OUT/"; else cp build/release/urbs build/release/urbs_headless "$OUT/"; fi
          cp -R data mods "$OUT/"
          cp -R assets/atlas assets/fonts assets/ui assets/music "$OUT/assets/"
          mkdir -p "$OUT/assets/sprites_iso/ui" && cp -R assets/sprites_iso/ui/chrome "$OUT/assets/sprites_iso/ui/"
          cp LICENSE.md LICENSE-ASSETS.txt NOTICE README.md RELEASE_NOTES.md "$OUT/"
          cd dist && (if [ "${{ matrix.name }}" = windows ]; then 7z a "urbs-$VERSION-windows.zip" "urbs-$VERSION-windows"; else tar czf "urbs-$VERSION-linux.tar.gz" "urbs-$VERSION-linux"; fi)
      - uses: actions/upload-artifact@v4
        with:
          name: urbs-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
