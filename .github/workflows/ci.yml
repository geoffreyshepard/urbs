name: CI
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/Shaders.cmake') }}
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libvulkan-dev
      - name: macOS deps
        if: runner.os == 'macOS'
        run: brew install ninja
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci
      - name: Test
        run: ctest --preset ci
      # Shortened stress run: 50k citizens must tick without heap allocation. Timing is not gated here
      # (shared runners are noisy); compare against bench/baseline.json on a quiet machine.
      - name: Stress (shortened)
        if: runner.os == 'macOS'
        run: ./build/ci/urbs_headless --scenario tests/scenarios/stress_50k.json --ticks 2400 | tee stress.json && grep -q '"alloc_violations":0' stress.json
